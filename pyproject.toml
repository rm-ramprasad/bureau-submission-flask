[project]
name = "submissions"
version = "0.1.0"
description = "Credit bureau submission file generation (UCRF consumer, commercial, NeSL)"
requires-python = ">=3.14,<3.15"     # tested on 3.14 only; the Docker image pins 3.14.5
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "PyMySQL>=1.1,<2",
    "PyYAML>=6,<7",
    "Flask>=3,<4",
    "boto3[crt]>=1.34,<2",     # crt: needed for `aws login` (login credential provider) and SSO sessions
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["submissions*"]

[tool.setuptools.package-data]
"submissions.canonical" = ["*.yaml"]
"submissions.validation" = ["packs/*.yaml"]
"submissions.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # tests import mock_data
addopts = "-q"
# SQLite-only (test databases); MySQL uses the driver's own datetime handling
filterwarnings = ["ignore:The default date(time)? adapter is deprecated:DeprecationWarning"]
