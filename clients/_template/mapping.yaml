# Mapping for NBFC <tenant_id>. Created by `python -m submissions.onboarding.new_tenant`.
#
# This file extends the base LMS mapping and lists ONLY what differs for this NBFC.
# Workflow (see ONBOARDING.md):
#   1. python -m submissions.onboarding.introspect --schema <schema>   -> which columns to override
#   2. edit this file
#   3. python -m submissions.adapters.check clients/<tenant_id>/mapping.yaml --schema <schema>
#   4. python -m submissions.onboarding.dry_run --tenant <tenant_id>
#
# Format reference: submissions/adapters/mapping.py. Quote codes that YAML reads as booleans ("ON", "OFF", "YES", "NO").
canonical_version: "1.0"
extends: ../_base/mapping.yaml

