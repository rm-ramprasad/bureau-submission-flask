{% extends "base.html" %}
{% block title %}Change password · Bureau Submissions{% endblock %}
{% block crumb %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1>
  <p class="subtitle">At least 10 characters, with letters and digits, not containing your username.</p></div></div>
<form method="post" class="panel stack narrow">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="current_password">Current password</label>
  <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
  <label for="new_password">New password</label>
  <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="10" required>
  <label for="repeat_password">Repeat the new password</label>
  <input type="password" id="repeat_password" name="repeat_password" autocomplete="new-password" minlength="10" required>
  <p><button type="submit">Change password</button></p>
</form>
{% endblock %}
