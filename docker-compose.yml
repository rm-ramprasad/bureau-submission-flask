# EC2 deployment: web UI + worker. Settings come from .env next to this file (see deploy/env.example).
# Scheduled tasks run from the host crontab with `docker compose run --rm` (see deploy/crontab).

x-app: &app
  build: .
  image: submissions:latest
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  web:
    <<: *app
    ports: ["8000:8000"]

  worker:
    <<: *app
    command: ["python", "-m", "submissions.worker", "--id", "ec2-worker"]
