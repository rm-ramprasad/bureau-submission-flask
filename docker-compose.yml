# EC2 deployment: HTTPS proxy (Caddy) + web UI + worker. Settings come from .env next to this file (see
# deploy/env.example); SITE_ADDRESS in .env is the public HTTPS name.
# Scheduled tasks run from the host crontab with `docker compose run --rm` (see deploy/crontab).

x-app: &app
  build: .
  image: submissions:latest
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # certificates (kept across restarts and rebuilds)
      - caddy_config:/config
    depends_on: [web]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]     # only on the server itself (Caddy and the SSM tunnel); not public

  worker:
    <<: *app
    command: ["python", "-m", "submissions.worker", "--id", "ec2-worker"]

volumes:
  caddy_data:
  caddy_config:
